version: '3.8'

services:
  # 1. Serviço do Banco de Dados
  mysql:
    image: mysql:8.0
    container_name: mysql-comunicacao
    environment:
      MYSQL_ROOT_PASSWORD: '1234'
      MYSQL_DATABASE: comunicacao1
    ports:
      - "3306:3306"
    networks:
      - rede-comunicacao

  # 2. Serviço da nossa API
  comunicacao-api:
    build: .
    container_name: comunicacao-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/comunicacao1?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: '1234'
    depends_on:
      - mysql
    networks:
      - rede-comunicacao

# 3. Rede automática criada entre eles
networks:
  rede-comunicacao:
    driver: bridge